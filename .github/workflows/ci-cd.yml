# Production CI/CD Pipeline with Best Practices
# Follows industry standards: separated jobs, sequential execution, fail-fast

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs for the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions required for Vercel integration
permissions:
  actions: read       # Required to list workflow jobs
  contents: read      # Required to read repository content
  statuses: write     # Required to send status updates to Vercel

env:
  NODE_VERSION: '20.x'
  
jobs:
  # Job 1: Code Quality (Lint)
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Notify Vercel - Lint Status
        if: always()
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'Vercel - hr-policy-assistant-pwvx: lint'

  # Job 2: Build Application
  build:
    name: Build Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      
      - name: Notify Vercel - Build Status
        if: always()
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'Vercel - hr-policy-assistant-pwvx: build'
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 1

  # Job 3: E2E Tests (Matrix strategy for multiple Node versions)
  test-e2e:
    name: E2E Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [lint, build]  # Wait for lint and build to complete first
    
    strategy:
      fail-fast: false  # Continue testing other versions even if one fails
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Start dev server (background)
        run: npm run dev &
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      
      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000 --timeout 60000
      
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:3000
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_ADMIN_ID: ${{ secrets.TEST_ADMIN_ID }}
          TEST_EMPLOYEE_EMAIL: ${{ secrets.TEST_EMPLOYEE_EMAIL }}
          TEST_EMPLOYEE_PASSWORD: ${{ secrets.TEST_EMPLOYEE_PASSWORD }}
          TEST_EMPLOYEE_ID: ${{ secrets.TEST_EMPLOYEE_ID }}
      
      - name: Notify Vercel - Test Status
        if: always()
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'Vercel - hr-policy-assistant-pwvx: test-e2e'
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: test-results/
          retention-days: 7
      
      - name: Upload test videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos-node-${{ matrix.node-version }}
          path: test-results/**/video.webm
          retention-days: 7
      
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 30
      
      - name: Add test results to summary
        if: always()
        run: |
          echo "## 🧪 E2E Test Results - Node ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "playwright-report/index.html" ]; then
            echo "### 📊 Test Report Available" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download the \`playwright-report-node-${{ matrix.node-version }}\` artifact below and open \`index.html\` to view detailed results." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### 📦 Available Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Results**: \`test-results-node-${{ matrix.node-version }}\` (7 days)" >> $GITHUB_STEP_SUMMARY
          echo "- **Playwright Report**: \`playwright-report-node-${{ matrix.node-version }}\` (30 days)" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ job.status }}" == "failure" ]; then
            echo "- **Test Videos**: \`test-videos-node-${{ matrix.node-version }}\` (7 days)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 **Tip**: Scroll to the bottom of this page to download artifacts." >> $GITHUB_STEP_SUMMARY

  # Job 4: Deploy to Vercel (ONLY after ALL jobs succeed)
  deploy:
    name: Deploy to Production
    needs: [test-e2e]  # Waits for tests (which wait for lint and build)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
      
      - name: Deployment summary
        if: success()
        run: |
          echo "🚀 Deployment successful!"
          echo "All tests passed and application deployed to production."

# ============================================================================
# CI/CD Pipeline Architecture:
# ============================================================================
# 
# ┌─────────────┐
# │   PR/Push   │
# └──────┬──────┘
#        │
#        ├───────────────┐
#        ▼               ▼
#    ┌──────┐       ┌───────┐
#    │ Lint │       │ Build │   (Stage 1: Parallel)
#    └───┬──┘       └───┬───┘
#        │              │
#        └──────┬───────┘
#               │
#      BOTH MUST PASS ✓
#               │
#        ┌──────┴──────┐
#        ▼             ▼
#    ┌────────┐   ┌────────┐
#    │ Test   │   │ Test   │   (Stage 2: Sequential after Stage 1)
#    │ (N18)  │   │ (N20)  │
#    └────┬───┘   └────┬───┘
#         │           │
#         └─────┬─────┘
#               │
#      TESTS MUST PASS ✓
#               │
#               ▼
#         ┌──────────┐
#         │  Deploy  │          (Stage 3: Sequential after Stage 2)
#         └──────────┘          (main branch only)
#
# Benefits:
# - Sequential execution (safer, predictable order)
# - Lint + Build run first (parallel with each other)
# - Tests wait for lint and build to pass
# - Deploy only after ALL checks pass
# - No broken code reaches production
# - Clear separation of concerns
# - Easy to debug (isolated stages)
#
# ============================================================================
